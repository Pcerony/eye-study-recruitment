<!doctype html>
<html lang="ja">
<script type="module" crossorigin src="/assets/researcher-DrpcxCAr.js"></script>
<link rel="modulepreload" crossorigin href="/assets/schedule-CmKKEJob.js">
<link rel="stylesheet" crossorigin href="/assets/schedule-DQlcUAFI.css">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参加者募集 管理</title>
<main>
  <h1>参加者募集 管理</h1>
  <button id="login" hidden>GitHubでログイン</button>
  <button id="logout" hidden>ログアウト</button>
  <p id="status" role="status"></p>
  <section id="dashboard" hidden>
    <h2>予約枠</h2>
    <form id="batch-form">
      <div class="schedule-fields">
        <label>開始日<input type="date" id="batch-start" required></label>
        <label>終了日<input type="date" id="batch-end" required></label>
        <label>定員<input type="number" id="batch-capacity" min="1" max="20" value="1" required></label>
      </div>
      <button type="submit">定時枠を一括追加（10:00–12:00 / 14:00–17:00）</button>
    </form>
    <form id="slot-form">
      <div class="schedule-fields">
        <label>日付<select id="start-day" required></select></label>
        <label>時（日本時間）<select id="start-hour" required></select></label>
        <label>分<select id="start-minute" required></select></label>
      </div>
      <label>定員<input type="number" id="capacity" min="1" max="20" value="1" required></label>
      <button type="submit">予約枠を追加</button>
    </form>
    <ul id="slots"></ul>
    <h2>予約</h2><ul id="bookings"></ul>
    <h2>希望日時</h2><ul id="interests"></ul>
  </section>
</main>
</html>
